# Local dev + integration tests.
# MongoDB, RabbitMQ, HAProxy in Docker. Ingest runs on the host (:4001, :4002, …).
# Do not run with `pnpm start`; that stack has its own internal mongodb + rabbitmq.

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  haproxy:
    image: haproxy:2.8-alpine
    ports:
      - "4000:4000"
    volumes:
      - ./config/haproxy.dev.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

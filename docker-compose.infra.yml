# Standalone mongo + rabbitmq for local pnpm dev (localhost:27017, :5672).
# Not used by `pnpm start` — that stack keeps its own internal mongo/rabbitmq.

services:
  mongo:
    container_name: mongo
    image: mongo:7
    ports:
      - "27017:27017"
    restart: unless-stopped

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

# Full Docker stack — ingest runs as a Compose service (scale with --scale ingest=N).

defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

frontend ingest
    bind *:4000
    default_backend ingest_nodes

backend ingest_nodes
    balance roundrobin
    server-template ingest 100 ingest:4000 check resolvers docker init-addr none

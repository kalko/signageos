# Local dev — ingest on host :4001–:4005, HAProxy picks running instances via TCP check.

defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend ingest
    bind *:4000
    default_backend ingest_nodes

backend ingest_nodes
    balance roundrobin
    server ingest1 host.docker.internal:4001 check
    server ingest2 host.docker.internal:4002 check
    server ingest3 host.docker.internal:4003 check
    server ingest4 host.docker.internal:4004 check
    server ingest5 host.docker.internal:4005 check

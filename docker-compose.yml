# Self-contained stack — internal MongoDB + RabbitMQ (no host ports).
# Do not run with `pnpm infra:start`; use either this or local dev infra, not both.
# More devices: DEVICE_COUNT=20 in .env
# Scale: pnpm start:scale  or  pnpm scale --scale ingest=N --scale processing=M

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: signageos
      RABBITMQ_DEFAULT_PASS: signageos
      RABBITMQ_ERLANG_COOKIE: signageos-dev-cookie
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    command: ["node", "apps/ingest-service/dist/index.js"]
    environment:
      AMQP_URL: amqp://signageos:signageos@rabbitmq:5672
      AMQP_QUEUE: signageos.events
      INGEST_HOST: 0.0.0.0
      INGEST_PORT: 4000
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - ingest
    restart: on-failure

  processing:
    build: .
    command: ["node", "apps/processing-service/dist/index.js"]
    environment:
      AMQP_URL: amqp://signageos:signageos@rabbitmq:5672
      AMQP_QUEUE: signageos.events
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: signageos
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: on-failure

  emulator:
    build: .
    command: ["node", "apps/device-emulator/dist/index.js"]
    environment:
      DEVICE_COUNT: ${DEVICE_COUNT:-5}
      EVENT_INTERVAL_MS: ${EVENT_INTERVAL_MS:-4000}
      INGEST_HOST: haproxy
      INGEST_PORT: 4000
      RECONNECT_DELAY_MS: 4000
    depends_on:
      - haproxy
      - processing
    restart: on-failure

volumes:
  rabbitmq_data:
  mongodb_data:
